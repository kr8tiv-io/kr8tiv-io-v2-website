# =====================================================================
# REPLACEMENT for .github/workflows/deploy-hostinger.yml
# ---------------------------------------------------------------------
# WHY IT LIVES HERE AND NOT IN .github/workflows/
# The credential this repo is pushed with is an OAuth app token WITHOUT
# the `workflow` scope, and GitHub refuses any push that creates or
# edits a workflow file without it:
#
#   ! [remote rejected] main -> main (refusing to allow an OAuth App to
#     create or update workflow `.github/workflows/deploy-hostinger.yml`
#     without `workflow` scope)
#
# Verified on both the git credential and the gh CLI login. So this file
# has to be applied by someone whose login has the scope.
#
# TO APPLY (either route, about 20 seconds):
#
#   A. Browser — fastest:
#        github.com/kr8tiv-io/kr8tiv-io-v2-website/blob/main/.github/workflows/deploy-hostinger.yml
#      click the pencil, select all, paste everything from the `name:`
#      line down, commit to main.
#
#   B. Shell, from a login that has the scope:
#        gh auth refresh -s workflow
#        cp ci/deploy-hostinger.improved.yml .github/workflows/deploy-hostinger.yml
#        git commit -am "ci: graceful skip without token, node 24 actions"
#        git push
#
# ---------------------------------------------------------------------
# WHAT THIS FIXES
#
# 1. NO MORE "ALL JOBS HAVE FAILED" EMAILS WHILE THE TOKEN IS UNSET.
#    Previously every push to main ran straight into the deploy step,
#    got a 401 from Hostinger, and exited 1 — a red X and an email each
#    time. Now the token is read into an env var and every deploy step
#    is gated on it. With no token the job BUILDS, VERIFIES, and exits
#    green with a clear note in the run summary. Nothing is silently
#    skipped-and-forgotten: the summary says, in plain words, that the
#    deploy was skipped and what to do about it.
#
#    This deliberately does NOT use `continue-on-error`. That would mark
#    the step failed-but-tolerated and still shows a red-ish result;
#    worse, it would also swallow a REAL deploy failure once the token
#    exists. Gating on the token skips cleanly when the token is absent
#    and still fails loudly when a present token breaks.
#
# 2. The Node 20 deprecation warning (the second annotation on the
#    failure email): actions/checkout@v4 and setup-node@v4 target Node
#    20 and are force-run on Node 24. Bumped to @v5, and node-version
#    20 -> 22 (20 is end-of-life).
#
# 3. Deploys are verified rather than assumed — see the verify step.
# =====================================================================
name: Deploy KR8TIV to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-hostinger.yml'
      - 'scripts/deploy-hostinger-static.mjs'
      - 'scripts/verify-live.mjs'

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Read the secret ONCE into the job env. `secrets` is not available
    # in job-level `if:`, but env IS available to step-level `if:`, so
    # this is what makes the graceful skip possible.
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_DOMAIN: kr8tiv.io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # One place decides whether this run deploys. Every deploy step
      # below reads this output, so the rule lives in exactly one spot.
      - name: Check for deploy credentials
        id: creds
        run: |
          if [ -n "$HOSTINGER_API_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
            echo "HOSTINGER_API_TOKEN is present (${#HOSTINGER_API_TOKEN} chars). Deploy will run."
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::HOSTINGER_API_TOKEN is not set, so the Hostinger upload is skipped. The build still ran and was verified. Add the secret under Settings > Secrets and variables > Actions to enable deploys."
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security audit (report only)
        run: npm audit --audit-level=critical || true

      - name: Build static site
        env:
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npm run build

      # The build is the part worth protecting whether or not we deploy:
      # a broken build should still fail this workflow loudly.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html   || { echo "::error::dist/404.html missing"; exit 1; }
          if [ ! -f dist/.htaccess ]; then
            echo "::error title=Missing .htaccess::public/.htaccess did not reach dist/. Cache headers would be wrong on live."
            exit 1
          fi
          echo "dist OK — $(find dist -type f | wc -l) files, .htaccess $(wc -c < dist/.htaccess) bytes."

      - name: Create deploy archive
        if: steps.creds.outputs.have_token == 'true'
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path('dist_hostinger.zip')
          count = 0
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for path in Path('dist').rglob('*'):
                  if path.is_file():
                      zf.write(path, path.relative_to('dist').as_posix())
                      count += 1
          print(f'Created {archive} ({archive.stat().st_size} bytes, {count} files)')
          assert count > 50, f'archive only has {count} files - build looks incomplete'
          PY

      - name: Install TUS client
        if: steps.creds.outputs.have_token == 'true'
        run: npm install --no-save --legacy-peer-deps tus-js-client@^4

      - name: Deploy to Hostinger
        if: steps.creds.outputs.have_token == 'true'
        run: node scripts/deploy-hostinger-static.mjs dist_hostinger.zip

      - name: Wait for propagation
        if: steps.creds.outputs.have_token == 'true'
        run: sleep 45

      - name: Verify live site + caches
        if: steps.creds.outputs.have_token == 'true'
        env:
          PUBLIC_BUILD_ID: ${{ github.sha }}
        run: node scripts/verify-live.mjs https://kr8tiv.io

      - name: Summary
        if: always()
        run: |
          {
            echo "### kr8tiv.io"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            if [ "${{ steps.creds.outputs.have_token }}" = "true" ]; then
              echo "- deploy: **ran** → https://kr8tiv.io"
            else
              echo "- deploy: **skipped — no HOSTINGER_API_TOKEN**"
              echo "- the build ran and was verified; only the upload was skipped"
              echo ""
              echo "To enable deploys: hPanel → avatar menu → Account Information → API tokens → Create token, then paste it into repo **Settings → Secrets and variables → Actions → \`HOSTINGER_API_TOKEN\`**."
            fi
          } >> $GITHUB_STEP_SUMMARY
